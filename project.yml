name: OutlookMac
options:
  bundleIdPrefix: com.oaustegard
  deploymentTarget:
    macOS: "14.0"
targets:
  OutlookMac:
    type: application
    platform: macOS
    sources:
      - App
      - Web
      - Menus
      - Settings
      - path: Bridge
        excludes:
          - bridge.js
      - path: Bridge/bridge.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oaustegard.outlook-mac
        PRODUCT_NAME: Outlook
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Outlook
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
